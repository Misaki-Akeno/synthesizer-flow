name: Quality

on:
  pull_request:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/synthesizerflow
      GITHUB_ID: ci-placeholder
      GITHUB_SECRET: ci-placeholder
      NEXTAUTH_SECRET: ci-placeholder-secret-for-build-validation
      NEXTAUTH_URL: http://localhost:3000
      RAG_EMBEDDINGS_DIM: '1024'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
